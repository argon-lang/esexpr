[package]
name = "esexpr-binary"
version = "0.2.5"
edition = "2024"
rust-version = "1.90.0"
license = "Apache-2.0"
description = "ESExpr serialization binary format."
documentation = "https://docs.rs/esexpr-binary"
homepage = "https://github.com/argon-lang/esexpr"
repository = "https://github.com/argon-lang/esexpr"
categories = [ "encoding" ]
readme = "README.md"

[features]
std = ["futures/std", "esexpr/std", "bytemuck/extern_crate_std", "embedded-io/std"]
async = ["dep:futures", "dep:embedded-io-async"]
default = ["std", "async"]

[dependencies]
bytemuck = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true, optional = true }
esexpr = { workspace = true }
num-bigint = { workspace = true }
derive_more = { workspace = true }
futures = { workspace = true, optional = true }
half = { workspace = true }
static_assertions = { workspace = true }

[dev-dependencies]
esexpr-json = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
embedded-io-adapters = { workspace = true, features = ["std", "tokio-1"] }

[lints]
workspace = true
