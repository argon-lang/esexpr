[package]
name = "esexpr-binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ESExpr serialization binary format."
documentation = "https://docs.rs/esexpr-binary"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"

[features]
std = ["futures/std", "esexpr/std", "bytemuck/extern_crate_std", "embedded-io/std"]
async = ["dep:futures", "dep:embedded-io-async"]
default = ["std", "async"]

[dependencies]
bytemuck = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true, optional = true }
esexpr = { workspace = true }
num-bigint = { workspace = true }
derive_more = { workspace = true }
futures = { workspace = true, optional = true }
half = { workspace = true }
static_assertions = { workspace = true }

[dev-dependencies]
esexpr = { workspace = true, features = ["proptest"] }
proptest = { workspace = true }
esexpr-json = { workspace = true }
deser-json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
embedded-io-adapters = { workspace = true, features = ["std", "tokio-1"] }

[lints]
workspace = true
