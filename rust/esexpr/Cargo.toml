[package]
name = "esexpr"
version = "0.1.20"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "ESExpr serialization format and related utilities."
documentation = "https://docs.rs/esexpr"
homepage = "https://github.com/argon-lang/esexpr"
repository = "https://github.com/argon-lang/esexpr"
categories = [ "encoding" ]
readme = "README.md"

[features]
default = ["std"]
std = ["esexpr-derive/macro_std", "num-bigint/std"]

[dependencies]
num-bigint = { workspace = true }
esexpr-derive = { workspace = true }

[lints]
workspace = true
