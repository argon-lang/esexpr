[workspace]
resolver = "2"

members = [
    "esexpr", "esexpr-utils", "esexpr_binary",
    "esexpr_derive", "esexpr_json", "esexpr_text",
]

[workspace.dependencies]
base64 = "0.22.1"
derive_more = { version = "2.0.1", features = [ "full" ] }
derive-syn-parse = "0.2.0"
esexpr = { version = "0.1.20", path = "esexpr" }
esexpr-binary = { version = "0.1.20", path = "esexpr_binary" }
esexpr-derive = { version = "0.1.20", path = "esexpr_derive" }
esexpr-json = { version = "0.1.20", path = "esexpr_json" }
esexpr-text = { version = "0.1.20", path = "esexpr_text" }
hexfloat2 = "0.1.3"
nom = "8.0.0"
num-bigint = "0.4.6"
proc-macro2 = "1.0.95"
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
static_assertions = "1.1.0"
syn = { version = "2.0.103", features = ["derive", "full"] }
