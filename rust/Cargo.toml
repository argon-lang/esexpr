[workspace]
resolver = "2"

members = [
    "esexpr", "esexpr-utils", "esexpr_binary",
    "esexpr_derive", "esexpr_json", "esexpr_text",
]

[workspace.dependencies]
base64 = "0.22.1"
derive_more = { version = "1.0.0", features = [ "full" ] }
derive-syn-parse = "0.2.0"
hexfloat2 = "0.1.3"
nom = "8.0.0"
num-bigint = "0.4.6"
num-integer = "0.1.46"
proc-macro2 = "1.0.93"
quote = "1.0.38"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["float_roundtrip"] }
static_assertions = "1.1.0"
syn = { version = "2.0.96", features = ["derive", "full"] }
