[workspace]
resolver = "3"

members = [
    "esexpr",
    "esexpr-binary",
    "esexpr-derive",
    "esexpr-examples",
    "esexpr-json",
    "esexpr-text",
    "esexpr-utils",
]

[workspace.package]
edition = "2024"
version = "0.4.0"
rust-version = "1.96.0"
license = "Apache-2.0"
homepage = "https://github.com/argon-lang/esexpr"
repository = "https://github.com/argon-lang/esexpr"
categories = [ "encoding" ]

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
ctrlc = { version = "3.5.2" }
darling = "0.24.1"
derive_more = { version = "2.1.1", default-features = false, features = [ "full" ] }
duplicate = { version = "2.0.1" }
embedded-io = { version = "0.7.1", features = ["alloc"] }
embedded-io-async = { version = "0.7.0", features = ["alloc"] }
embedded-io-adapters = { version = "0.7.0" }
esexpr = { version = "0.4.0", path = "esexpr", default-features = false }
esexpr-binary = { version = "0.4.0", path = "esexpr-binary", default-features = false }
esexpr-derive = { version = "0.4.0", path = "esexpr-derive", default-features = false }
esexpr-json = { version = "0.4.0", path = "esexpr-json", default-features = false }
esexpr-text = { version = "0.4.0", path = "esexpr-text", default-features = false }
futures = { version = "0.3.34", default-features = false }
half = { version = "2.7.1", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.1" }
hexponent = { version = "0.3.1", default-features = false }
itertools = { version = "0.15.0", default-features = false }
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.5.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
proc-macro2 = "1.0.107"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quote = "1.0.47"
deser = { version = "0.10.1", default-features = false, features = ["derive"] }
deser-value = "0.10.1"
deser-json = { version = "0.10.1", default-features = false }
static_assertions = "1.1.0"
syn = { version = "3.0.9", features = ["derive", "full", "visit"] }
tokio = "1.54.0"
ui_test = "0.30.7"


[workspace.lints.rust]
macro_use_extern_crate = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
unwrap_used = "deny"
needless_lifetimes = "allow"
elidable_lifetime_names = "allow"
match_wildcard_for_single_variants = "allow"
single_match_else = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
collapsible_else_if = "allow"
similar_names = "allow"
mismatching_type_param_order = "allow"
ignored_unit_patterns = "allow"
tabs_in_doc_comments = "allow"
wildcard_imports = "allow"
